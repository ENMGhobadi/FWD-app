# Render Blueprint for the Python relay endpoint.
# This repository intentionally has no requirements.txt; keep the dependency pinned here.
services:
  - type: web
    name: mhr-forwarder-py
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install --no-cache-dir curl_cffi==0.16.3
    startCommand: python -u forwarder.py
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: AUTH_KEY
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: IMPERSONATE
        value: chrome
      - key: TIMEOUT_MS
        value: "90000"
      - key: MAX_BODY_BYTES
        value: "52428800"
      - key: MAX_REQUEST_BYTES
        value: "52428800"
      - key: REDIRECT_LIMIT
        value: "5"
