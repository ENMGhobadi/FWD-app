# Render Blueprint for the Chrome-impersonating forwarder.
# Lives at the repository root, next to forwarder.py and requirements.txt.
# Render Dashboard -> New -> Blueprint -> select this repo.
services:
  - type: web
    name: mhr-forwarder-py
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python forwarder.py
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: AUTH_KEY
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: IMPERSONATE
        value: chrome
      - key: EGRESS_PROXY
        sync: false
      - key: TIMEOUT_MS
        value: "90000"
